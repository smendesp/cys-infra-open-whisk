name: Deploy OpenWhisk

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      destroy:
        description: 'Destruir o deployment do OpenWhisk'
        type: boolean
        default: false

jobs:
  plan:
    name: Terraform Plan (Preview)
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        env:
          TF_VAR_openwhisk_api_host: ${{ vars.OPENWHISK_API_HOST }}
          TF_VAR_openwhisk_api_host_port: ${{ vars.OPENWHISK_API_HOST_PORT }}
          TF_VAR_openwhisk_auth_system_key: ${{ secrets.OPENWHISK_AUTH_SYSTEM_KEY }}
          TF_VAR_openwhisk_auth_guest_key: ${{ secrets.OPENWHISK_AUTH_GUEST_KEY }}
          TF_VAR_openwhisk_db_password: ${{ secrets.OPENWHISK_DB_PASSWORD }}
        run: |
          terraform plan \
            -var="openwhisk_api_host=${TF_VAR_openwhisk_api_host:-localhost}" \
            -var="openwhisk_api_host_port=${TF_VAR_openwhisk_api_host_port:-31001}" \
            -var="openwhisk_auth_system_key=${TF_VAR_openwhisk_auth_system_key:-23bc46b1-71f6-4ed5-8c54-816aa4f8c502:123zO3xZCLrMN6v2BKK1dXYFpXlPkccOFqm12CdAsMgRU4VrNZ9lyGVCGuMDGIwP}" \
            -var="openwhisk_auth_guest_key=${TF_VAR_openwhisk_auth_guest_key:-a7fa79f2-8e4c-45d2-b3f1-92cd7408e12f:6dZxC2nBqLpR8vW4kYsT1aUfM3eH5gJ7dF9cN0lA2bC4pQ6rS8t}" \
            -var="openwhisk_db_password=${TF_VAR_openwhisk_db_password:-some_passw0rd}"

  deploy:
    name: Deploy no Kubernetes
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name != 'pull_request' && inputs.destroy != true
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        env:
          TF_VAR_openwhisk_api_host: ${{ vars.OPENWHISK_API_HOST }}
          TF_VAR_openwhisk_api_host_port: ${{ vars.OPENWHISK_API_HOST_PORT }}
          TF_VAR_openwhisk_auth_system_key: ${{ secrets.OPENWHISK_AUTH_SYSTEM_KEY }}
          TF_VAR_openwhisk_auth_guest_key: ${{ secrets.OPENWHISK_AUTH_GUEST_KEY }}
          TF_VAR_openwhisk_db_password: ${{ secrets.OPENWHISK_DB_PASSWORD }}
        run: |
          terraform plan -out=tfplan \
            -var="openwhisk_api_host=${TF_VAR_openwhisk_api_host:-localhost}" \
            -var="openwhisk_api_host_port=${TF_VAR_openwhisk_api_host_port:-31001}" \
            -var="openwhisk_auth_system_key=${TF_VAR_openwhisk_auth_system_key:-23bc46b1-71f6-4ed5-8c54-816aa4f8c502:123zO3xZCLrMN6v2BKK1dXYFpXlPkccOFqm12CdAsMgRU4VrNZ9lyGVCGuMDGIwP}" \
            -var="openwhisk_auth_guest_key=${TF_VAR_openwhisk_auth_guest_key:-a7fa79f2-8e4c-45d2-b3f1-92cd7408e12f:6dZxC2nBqLpR8vW4kYsT1aUfM3eH5gJ7dF9cN0lA2bC4pQ6rS8t}" \
            -var="openwhisk_db_password=${TF_VAR_openwhisk_db_password:-some_passw0rd}"

      - name: Terraform Apply (renderizar manifests)
        env:
          TF_VAR_openwhisk_api_host: ${{ vars.OPENWHISK_API_HOST }}
          TF_VAR_openwhisk_api_host_port: ${{ vars.OPENWHISK_API_HOST_PORT }}
          TF_VAR_openwhisk_auth_system_key: ${{ secrets.OPENWHISK_AUTH_SYSTEM_KEY }}
          TF_VAR_openwhisk_auth_guest_key: ${{ secrets.OPENWHISK_AUTH_GUEST_KEY }}
          TF_VAR_openwhisk_db_password: ${{ secrets.OPENWHISK_DB_PASSWORD }}
        run: |
          terraform apply tfplan

      - name: Criar diretorio de destino na VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo rm -drf /opt/cys/openwhisk
            sudo mkdir -p /opt/cys/openwhisk

      - name: Copiar manifestos para VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy"
          target: "/opt/cys/openwhisk/deploy"
          strip_components: 1

      - name: kubectl apply (aplicar no cluster)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            echo "==> Aplicando manifestos..."
            for f in /opt/cys/openwhisk/deploy/0*.yaml; do
              echo "--- $(basename "$f") ---"
              kubectl apply -f "$f"
            done

            echo ""
            echo "==> Aguardando deployments..."
            kubectl wait --for=condition=Available deployment \
              --all -n openwhisk --timeout=600s || true

            echo ""
            echo "==> Aguardando conclusao dos jobs de inicializacao..."
            kubectl wait --for=condition=Complete job \
              --all -n openwhisk --timeout=600s || true

            echo ""
            echo "==> Status dos pods =="
            kubectl get pods -n openwhisk -o wide

      - name: Verificar implantacao
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "=== Pods ==="
            kubectl get pods -n openwhisk -o wide

            echo ""
            echo "=== Services ==="
            kubectl get svc -n openwhisk

            echo ""
            echo "=== Resumo do rollout ==="
            FAILED_PODS=$(kubectl get pods -n openwhisk \
              --no-headers 2>/dev/null \
              | grep -v -E 'Running|Completed|Succeeded' || true)
            if [ -n "$FAILED_PODS" ]; then
              echo "ALERTA: Pods com status diferente de Running/Completed:"
              echo "$FAILED_PODS"
              echo ""
              echo "=== Logs dos pods com falha ==="
              for pod in $(echo "$FAILED_PODS" | awk '{print $1}'); do
                echo "--- $pod ---"
                kubectl logs -n openwhisk "$pod" --all-containers=true --tail=100 || true
              done
              exit 1
            fi
            echo "Todos os pods estao Running ou Completed."

      - name: Limpar diretorio de destino na VM
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo rm -drf /opt/cys/openwhisk

  destroy:
    name: Destroy OpenWhisk
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && inputs.destroy == true
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy (limpar state)
        env:
          TF_VAR_openwhisk_api_host: ${{ vars.OPENWHISK_API_HOST }}
          TF_VAR_openwhisk_api_host_port: ${{ vars.OPENWHISK_API_HOST_PORT }}
          TF_VAR_openwhisk_auth_system_key: ${{ secrets.OPENWHISK_AUTH_SYSTEM_KEY }}
          TF_VAR_openwhisk_auth_guest_key: ${{ secrets.OPENWHISK_AUTH_GUEST_KEY }}
          TF_VAR_openwhisk_db_password: ${{ secrets.OPENWHISK_DB_PASSWORD }}
        run: |
          terraform destroy -auto-approve \
            -var="openwhisk_api_host=${TF_VAR_openwhisk_api_host:-localhost}" \
            -var="openwhisk_api_host_port=${TF_VAR_openwhisk_api_host_port:-31001}" \
            -var="openwhisk_auth_system_key=${TF_VAR_openwhisk_auth_system_key:-23bc46b1-71f6-4ed5-8c54-816aa4f8c502:123zO3xZCLrMN6v2BKK1dXYFpXlPkccOFqm12CdAsMgRU4VrNZ9lyGVCGuMDGIwP}" \
            -var="openwhisk_auth_guest_key=${TF_VAR_openwhisk_auth_guest_key:-a7fa79f2-8e4c-45d2-b3f1-92cd7408e12f:6dZxC2nBqLpR8vW4kYsT1aUfM3eH5gJ7dF9cN0lA2bC4pQ6rS8t}" \
            -var="openwhisk_db_password=${TF_VAR_openwhisk_db_password:-some_passw0rd}"

      - name: kubectl delete namespace openwhisk
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            echo "==> Verificando namespace..."
            if ! kubectl get namespace openwhisk &>/dev/null; then
              echo "Namespace openwhisk nao existe. Nada a remover."
              exit 0
            fi

            echo "==> Removendo recursos remanescentes..."
            kubectl delete all,ingress,configmap,secret,pvc,pv,networkpolicy \
              --all -n openwhisk --ignore-not-found=true --timeout=300s || true

            echo "==> Removendo namespace openwhisk..."
            kubectl delete namespace openwhisk --timeout=300s || true

            echo "==> Verificando remocao..."
            if kubectl get namespace openwhisk &>/dev/null; then
              echo "Namespace ainda existente. Aguardando finalizacao..."
              kubectl wait --for=delete namespace/openwhisk --timeout=600s || true
            fi

            echo "Namespace openwhisk removido com sucesso."

      - name: Limpar diretorio na VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo rm -drf /opt/cys/openwhisk
            echo "Diretorio /opt/cys/openwhisk removido."
