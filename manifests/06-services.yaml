apiVersion: v1
kind: Service
metadata:
  name: owdev-controller
  namespace: openwhisk
  labels:
    name: owdev-controller
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
spec:
  selector:
    name: owdev-controller
  ports:
    - port: 8080
      name: http
