apiVersion: v1
kind: Service
metadata:
  name: owdev-couchdb
  namespace: openwhisk
  labels:
    name: owdev-couchdb
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
spec:
  selector:
    name: owdev-couchdb
  ports:
    - port: 5984
      name: couchdb
