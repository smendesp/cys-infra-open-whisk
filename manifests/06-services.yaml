apiVersion: v1
kind: Service
metadata:
  name: owdev-nginx
  namespace: openwhisk
  labels:
    name: owdev-nginx
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
spec:
  type: NodePort
  selector:
    name: owdev-nginx
  ports:
    - port: 80
      name: http
    - port: 443
      nodePort: ${OPENWHISK_API_HOST_PORT}
      name: https-api
