# Core pods are allowed to have view access to k8s APIs
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: owdev-allow-view
  namespace: openwhisk
  labels:
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: owdev-core
    namespace: "openwhisk"
---
