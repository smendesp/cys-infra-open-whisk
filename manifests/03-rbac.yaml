# A role to allow initialization jobs to create secrets and config maps
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: owdev-init-role
  namespace: openwhisk
  labels:
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "get"]
---
