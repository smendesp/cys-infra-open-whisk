apiVersion: v1
kind: Pod
metadata:
  name: owdev-wskadmin
  labels:
    name: owdev-wskadmin
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
spec:
  restartPolicy: Always
  
  containers:
  - name: wskadmin
    image: "openwhisk/ow-utils:1.0.0"
    imagePullPolicy: "IfNotPresent"
    command: ["/bin/bash", "-c", "tail -f /dev/null"]
    env:
    - name: "WHISK_LOGS_DIR"
      value: "/var/log"
      # Provider database configuration
    # Use the internally deployed CouchDB service for the providers
    - name: "DB_HOST"
      valueFrom:
        configMapKeyRef:
          name: owdev-db.config
          key: db_host
    - name: "DB_PROTOCOL"
      valueFrom:
        configMapKeyRef:
          name: owdev-db.config
          key: db_protocol
    - name: "DB_PORT"
      valueFrom:
        configMapKeyRef:
          name: owdev-db.config
          key: db_port
    - name: "DB_USERNAME"
      valueFrom:
        secretKeyRef:
          name: owdev-db.auth
          key: db_username
    - name: "DB_PASSWORD"
      valueFrom:
        secretKeyRef:
          name: owdev-db.auth
          key: db_password
    
    - name: "DB_WHISK_ACTIONS"
      valueFrom:
          configMapKeyRef:
            name: owdev-db.config
            key: db_whisk_actions
    
    - name: "DB_WHISK_AUTHS"
      valueFrom:
        configMapKeyRef:
          name: owdev-db.config
          key: db_whisk_auths
    
    - name: "DB_WHISK_ACTIVATIONS"
      valueFrom:
          configMapKeyRef:
              name: owdev-db.config
              key: db_whisk_activations

