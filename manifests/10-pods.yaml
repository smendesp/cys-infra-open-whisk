apiVersion: v1
kind: Pod
metadata:
  name: owdev-tests-package-checker
  labels:
    name: owdev-tests-package-checker
    ow-testpod: "true"
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
  annotations:
    "helm.sh/hook": test-success
spec:
  restartPolicy: Never
  volumes:
  - name: task-dir
    configMap:
      name: owdev-tests-package-checker
  
  containers:
  - name: package-checker
    image: "openwhisk/ow-utils:1.0.0"
    imagePullPolicy: "IfNotPresent"
    command: ["/bin/bash", "/task/myTask.sh"]
    volumeMounts:
    - name: task-dir
      mountPath: "/task/myTask.sh"
      subPath: "myTask.sh"
    env:
      - name: "WSK_AUTH"
        valueFrom:
          secretKeyRef:
            name: owdev-whisk.auth
            key: guest
      - name: "WSK_API_HOST_URL"
        valueFrom:
          configMapKeyRef:
            name: owdev-whisk.config
            key: whisk_api_host_url

      # Which of the providers was installed (and thus should be checked)?
      - name: "OW_INSTALL_ALARM_PROVIDER"
        value:  "no" 
      - name: "OW_INSTALL_KAFKA_PROVIDER"
        value:  "yes"

