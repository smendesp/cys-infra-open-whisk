apiVersion: batch/v1
kind: Job
metadata:
  name: owdev-gen-certs
  namespace: openwhisk
  labels:
    name: owdev-gen-certs
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
spec:
  backoffLimit: 3
  template:
    metadata:
      name: owdev-gen-certs
      labels:
        name: owdev-gen-certs
        heritage: "Helm"
        release: "owdev"
        chart: "openwhisk-1.0.0"
        app: owdev-openwhisk
    spec:
      serviceAccountName: owdev-init-sa
      restartPolicy: Never
      volumes:
      - name: task-dir
        configMap:
          name: owdev-gen-certs
      
      containers:
      - name: gen-certs
        image: "openwhisk/ow-utils:1.0.0"
        imagePullPolicy: "IfNotPresent"
        command: ["/bin/bash", "-c", "set -e; . /task/gencerts.sh"]
        volumeMounts:
        - name: task-dir
          mountPath: "/task/gencerts.sh"
          subPath: "gencerts.sh"
        env:
        - name: "NGINX_CERT_SECRET"
          value: owdev-nginx
        - name: "WHISK_API_HOST_NAME"
          valueFrom:
            configMapKeyRef:
              name: owdev-whisk.config
              key: whisk_api_host_name
