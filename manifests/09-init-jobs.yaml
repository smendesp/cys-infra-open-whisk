apiVersion: batch/v1
kind: Job
metadata:
  name: owdev-init-couchdb
  namespace: openwhisk
  labels:
    name: owdev-init-couchdb
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
spec:
  backoffLimit: 3
  template:
    metadata:
      name: owdev-init-couchdb
      labels:
        name: owdev-init-couchdb
        heritage: "Helm"
        release: "owdev"
        chart: "openwhisk-1.0.0"
        app: owdev-openwhisk
    spec:
      restartPolicy: Never
      volumes:
      - name: task-dir
        configMap:
          name: owdev-init-couchdb
      - name: whisk-auth
        secret:
          secretName: owdev-whisk.auth
      
      containers:
      - name: init-couchdb
        image: "openwhisk/ow-utils:1.0.0"
        imagePullPolicy: "IfNotPresent"
        command: ["/bin/bash", "-c", "set -e; . /task/initdb.sh"]
        volumeMounts:
        - name: task-dir
          mountPath: "/task/initdb.sh"
          subPath: "initdb.sh"
        - name: whisk-auth
          mountPath: "/etc/whisk-auth"
        env:
        - name: "DB_PROTOCOL"
          valueFrom:
            configMapKeyRef:
              name: owdev-db.config
              key: db_protocol
        - name: "DB_HOST"
          valueFrom:
            configMapKeyRef:
              name: owdev-db.config
              key: db_host
        - name: "DB_PORT"
          valueFrom:
            configMapKeyRef:
              name: owdev-db.config
              key: db_port
        - name: "DB_PREFIX"
          valueFrom:
            configMapKeyRef:
              name: owdev-db.config
              key: db_prefix
        - name: "COUCHDB_USER"
          valueFrom:
            secretKeyRef:
              name: owdev-db.auth
              key: db_username
        - name: "COUCHDB_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: owdev-db.auth
              key: db_password
        - name: "WHISK_AUTH_GUEST"
          valueFrom:
            secretKeyRef:
              name: owdev-whisk.auth
              key: guest
        - name: "WHISK_AUTH_SYSTEM"
          valueFrom:
            secretKeyRef:
              name: owdev-whisk.auth
              key: system
        - name: "NODENAME"
          value: "couchdb0"

        # tag to use for git clone to get ansible files to initialize couchdb
        - name: "OW_GIT_TAG_OPENWHISK"
          value: "1.0.0"
---
