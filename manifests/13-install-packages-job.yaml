apiVersion: batch/v1
kind: Job
metadata:
  name: owdev-install-packages
  namespace: openwhisk
  labels:
    name: owdev-install-packages
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
spec:
  backoffLimit: 3
  template:
    metadata:
      name: owdev-install-packages
      labels:
        name: owdev-install-packages
        heritage: "Helm"
        release: "owdev"
        chart: "openwhisk-1.0.0"
        app: owdev-openwhisk
    spec:
      restartPolicy: Never
      volumes:
      - name: task-dir
        configMap:
          name: owdev-install-packages-cm
      initContainers:
      
      containers:
      - name: install-packages
        image: "openwhisk/ow-utils:1.0.0"
        imagePullPolicy: "IfNotPresent"
        command: ["/bin/bash", "-c", "set -e; . /task/myTask.sh"]
        volumeMounts:
        - name: task-dir
          mountPath: "/task/myTask.sh"
          subPath: "myTask.sh"
        env:
          - name: "WHISK_AUTH"
            valueFrom:
              secretKeyRef:
                name: owdev-whisk.auth
                key: system
          - name: "WHISK_API_HOST"
            value: "owdev-nginx.openwhisk.svc.cluster.local"
          - name: "WHISK_API_HOST_URL"
            value: "http://owdev-nginx.openwhisk.svc.cluster.local"
          # apigateway configuration (for installing routemgmt actions)
          - name: "WHISK_SYSTEM_NAMESPACE"
            valueFrom:
              configMapKeyRef:
                name: owdev-whisk.config
                key: whisk_system_namespace
          - name: "WHISK_API_GATEWAY_HOST_V2"
            value: "http://owdev-apigateway.openwhisk.svc.cluster.local:9000/v2"

          # Provider database configuration
          # Use the internally deployed CouchDB service for the providers
          - name: "PROVIDER_DB_HOST"
            valueFrom:
              configMapKeyRef:
                name: owdev-db.config
                key: db_host
          - name: "PROVIDER_DB_PROTOCOL"
            valueFrom:
              configMapKeyRef:
                name: owdev-db.config
                key: db_protocol
          - name: "PROVIDER_DB_PORT"
            valueFrom:
              configMapKeyRef:
                name: owdev-db.config
                key: db_port
          - name: "PROVIDER_DB_USERNAME"
            valueFrom:
              secretKeyRef:
                name: owdev-db.auth
                key: db_username
          - name: "PROVIDER_DB_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: owdev-db.auth
                key: db_password
          

          # Provider database table prefixes
          - name: "ALARM_DB_PREFIX"
            value: "alm"
          - name: "KAFKA_DB_PREFIX"
            value: "kp"

          # Should each of the providers be installed?
          - name: "OW_INSTALL_ALARM_PROVIDER"
            value:  "no" 
          - name: "OW_INSTALL_KAFKA_PROVIDER"
            value:  "yes" 

          # tags to use for git clone operations
          - name: "OW_GIT_TAG_OPENWHISK"
            value: "1.0.0"
          - name: "OW_GIT_TAG_OPENWHISK_CATALOG"
            value: "0.11.0"
          - name: "OW_GIT_TAG_OPENWHISK_PACKAGE_ALARMS"
            value: "2.2.0"
          - name: "OW_GIT_TAG_OPENWHISK_PACKAGE_KAFKA"
            value: "2.1.0"
