apiVersion: v1
kind: Secret
metadata:
  name: owdev-db.auth
  labels:
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
type: Opaque
stringData:
  db_username: "whisk_admin"
  db_password: "${OPENWHISK_DB_PASSWORD}"

