# Default deny all ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: owdev-default-no-ingress-np
  labels:
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# Source: openwhisk/templates/network-policy.yaml
# Backend control plane pods only accept connections from non-user-action-pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: owdev-backend-np
  labels:
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
spec:
  podSelector:
    matchExpressions:
      - {key: user-action-pod, operator: DoesNotExist}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
          - {key: user-action-pod, operator: DoesNotExist}

---
# Source: openwhisk/templates/network-policy.yaml
# Frontend pods (nginx, controller, apigateway) accept connections from anyone
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: owdev-frontend-np
  labels:
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
spec:
  podSelector:
    matchExpressions:
      - {key: name, operator: In, values: ["owdev-controller", "owdev-apigateway", "owdev-nginx"]}
  policyTypes:
  - Ingress
  ingress:
  - {}

---
# Source: openwhisk/templates/network-policy.yaml
# User action pods will only accept connections from invokers
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: owdev-actions-allow-invoker-np
  labels:
    heritage: "Helm"
    release: "owdev"
    chart: "openwhisk-1.0.0"
    app: owdev-openwhisk
spec:
  podSelector:
    matchExpressions:
      - {key: user-action-pod, operator: In, values: ["true"]}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: owdev-invoker
