# OpenWhisk Helm Chart Configuration
# Documentacao: https://github.com/apache/openwhisk-deploy-kube

# ---------------------------------------------------------------------------
# Ingress - Ponto de entrada da API OpenWhisk
# ---------------------------------------------------------------------------
whisk:
  ingress:
    type: NodePort
    apiHostName: ${OPENWHISK_API_HOST}
    apiHostPort: ${OPENWHISK_API_HOST_PORT}
    apiHostProto: https
    # Certificado TLS autoassinado (padrao). Substitua para certificado real.
    tls:
      enabled: true
      createsecret: true
      secretname: openwhisk-ingress-tls
  auth:
    system: ${OPENWHISK_AUTH_SYSTEM_KEY}

# ---------------------------------------------------------------------------
# Persistencia - Volumes persistentes para CouchDB
# ---------------------------------------------------------------------------
k8s:
  persistence:
    enabled: true
    hasDefaultStorageClass: true
    explicitStorageClass: ""

# ---------------------------------------------------------------------------
# Affinity e Toleration - Posicionamento de pods nos nodes
# Descomente para clusters multi-node com nodes dedicados.
# ---------------------------------------------------------------------------
affinity:
  enabled: true
  # Label nodes com: kubectl label node <NODE> openwhisk-role=invoker
  #                     kubectl label node <NODE> openwhisk-role=core
  #                     kubectl label node <NODE> openwhisk-role=edge

toleration:
  enabled: false

# Para cluster single-node, descomente as linhas abaixo:
# affinity:
#   enabled: false
# toleration:
#   enabled: false
# invoker:
#   options: "-Dwhisk.kubernetes.user-pod-node-affinity.enabled=false"

# ---------------------------------------------------------------------------
# Invoker - Executor das actions
# ---------------------------------------------------------------------------
invoker:
  replicaCount: 1
  containerFactory:
    impl: "kubernetes"
    kubernetes:
      replicaCount: 1
  # Memoria total disponivel para pool de containers de usuario
  containerPool:
    userMemory: "2048m"

# ---------------------------------------------------------------------------
# Controller - Orquestrador principal do OpenWhisk
# lean: true elimina Kafka e Zookeeper, usando message bus em memoria.
# Para ambientes que exigem entrega garantida de mensagens, desative lean
# e configure as secoes kafka e zookeeper abaixo.
# ---------------------------------------------------------------------------
controller:
  replicaCount: 1
  lean: true

# ---------------------------------------------------------------------------
# Kafka - Message broker (inativo no modo lean)
# Descomente as linhas abaixo ao desativar lean: true.
# ---------------------------------------------------------------------------
# kafka:
#   replicaCount: 1
#   persistence:
#     size: "2Gi"

# ---------------------------------------------------------------------------
# Zookeeper - Coordenacao do Kafka (inativo no modo lean)
# Descomente as linhas abaixo ao desativar lean: true.
# ---------------------------------------------------------------------------
# zookeeper:
#   replicaCount: 1
#   persistence:
#     size: "1Gi"

# ---------------------------------------------------------------------------
# CouchDB - Banco de dados do OpenWhisk
# ---------------------------------------------------------------------------
db:
  provider: "CouchDB"
  auth: "whisk_admin:${OPENWHISK_DB_PASSWORD}"
  protocol: http
  host: "owdev-couchdb.openwhisk.svc.cluster.local"
  port: 5984

  # Para CouchDB externo, descomente e configure:
  # external: true
  # host: <endereco-couchdb-externo>
  # port: <porta-couchdb-externo>
  # protocol: https
  # auth: <usuario>:<senha>

# ---------------------------------------------------------------------------
# Redis - Armazenamento em memoria (opcional, melhora performance)
# ---------------------------------------------------------------------------
redis:
  replicaCount: 0

# ---------------------------------------------------------------------------
# NGINX - Proxy reverso do OpenWhisk
# ---------------------------------------------------------------------------
nginx:
  httpsNodePort: 31001
  httpNodePort: 31002

# ---------------------------------------------------------------------------
# APIGateway - Gateway de API integrado
# ---------------------------------------------------------------------------
apigw:
  replicaCount: 0

# ---------------------------------------------------------------------------
# Limits - Limites de actions e triggers
# ---------------------------------------------------------------------------
limits:
  actionsInvokesPerminute: 60
  actionsInvokesConcurrent: 30
  triggersFiresPerminute: 60
  actionsSequenceMaxlength: 50
  # Memoria e timeout padrao por action
  actionsMemoryMax: "512m"
  actionsMemoryDefault: "256m"
  actionsTimeoutMax: "300000"  # 5 min em ms
  actionsTimeoutDefault: "60000"  # 1 min em ms

# ---------------------------------------------------------------------------
# Providers - Event providers
# ---------------------------------------------------------------------------
providers:
  alarm:
    enabled: true
    apiPort: 32300
  cloudant:
    enabled: false
  kafkaFeed:
    enabled: false

# ---------------------------------------------------------------------------
# Registry - Container registry para imagens das actions
# ---------------------------------------------------------------------------
registry:
  dns: ""

# ---------------------------------------------------------------------------
# Metricas e Monitoramento
# ---------------------------------------------------------------------------
metrics:
  prometheusEnabled: false
  kafkaEnabled: false
  userMetricsEnabled: false
